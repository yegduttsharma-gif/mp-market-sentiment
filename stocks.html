<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDMP · Stock Observer</title><style>body{margin:0;background:#0b1220;color:#edf3ff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px 15px}a{color:#9dd9ff}.muted,small{color:#a9b9d0;line-height:1.5}.card{background:#18263d;border:1px solid #33445d;border-radius:15px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.score{font-size:26px;font-weight:750;margin:10px 0}.pill{background:#273c58;border-radius:8px;padding:5px 8px;display:inline-block;margin:3px;font-size:13px}select,button{background:#273c58;color:white;padding:12px;border:1px solid #63718a;border-radius:8px;font:inherit;max-width:100%}li{margin:10px 0;overflow-wrap:anywhere}summary{cursor:pointer}svg{width:100%;max-width:650px}h1{font-size:28px}</style></head><body><main><p><a href="./sectors.html">← Sector Observer</a> · <a href="./">Main PDMP</a></p><h1>PDMP · Stock Observer</h1><p class="muted">Individual Indian stock public-discussion sentiment. Not a verified investor poll, price forecast, or trading recommendation.</p><div class="card" id="status">Loading saved stock discussions…</div><p><label for="stock">Choose stock</label> <select id="stock"></select> <button id="refresh">Check latest saved data</button></p><div id="content"></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let snapshot=null,history=null;
function chart(rows){const valid=(rows||[]).filter(x=>x.bullish_pct!==null&&x.directional>0).slice(-30);if(valid.length<2)return '<p class="muted">Trend pending: at least two actual daily readings required. No historical readings are fabricated.</p>';const points=valid.map((r,i)=>(10+i*580/(valid.length-1)).toFixed(1)+','+(105-r.bullish_pct*.9).toFixed(1)).join(' ');return '<svg viewBox="0 0 600 125" role="img" aria-label="Daily bullish discussion percentage"><line x1="10" y1="105" x2="590" y2="105" stroke="#63718a"/><polyline fill="none" stroke="#9dd9ff" stroke-width="3" points="'+points+'"/></svg><small>'+esc(valid[0].date)+' to '+esc(valid[valid.length-1].date)+' · '+valid.length+' actual daily observations · first '+valid[0].bullish_pct+'%, latest '+valid[valid.length-1].bullish_pct+'%</small>'}
function render(){if(!snapshot)return;const name=document.getElementById('stock').value;const s=(snapshot.stocks||[]).find(x=>x.name===name);if(!s)return;const up=Number(s.bullish)||0,down=Number(s.bearish)||0,n=up+down,p=n?Math.round(100*up/n):null;const qualified=n>=10;const investor=s.investor_mentions??s.mentions;const commentary=s.commentary_mentions;const evidence=(s.evidence||[]);document.getElementById('content').innerHTML='<div class="card"><h2>'+esc(name)+'</h2><div class="score">'+(qualified?(p+'% bullish in directional discussions'):'Insufficient Evidence')+'</div><p>Directional investor discussion: '+up+' bullish · '+down+' bearish · '+(s.neutral||0)+' neutral</p><p><span class="pill">Investor discussion titles: '+investor+'</span>'+(commentary===undefined?'':' <span class="pill">Market commentary titles: '+commentary+'</span>')+'</p><p class="muted">'+(qualified?'Limited directional sample; not a representative investor survey.':'Fewer than ten directional investor-discussion titles. No reliable sentiment conclusion.')+'</p></div><div class="card"><h2>Historical sentiment</h2>'+chart(history?.stocks?.[name])+'<p class="muted">Daily bullish share among directional investor discussion titles. Coverage and titles can vary; these are not price predictions.</p></div><div class="card"><h2>Source evidence</h2><p class="muted">Publicly indexed titles, not verified independent investor votes. Commentary is displayed separately from investor discussion.</p><ul>'+evidence.map(e=>'<li><a href="'+esc(/^https?:\/\//.test(e.url||'')?e.url:'#')+'" target="_blank" rel="noopener noreferrer">'+esc(e.title)+'</a><br><small>'+esc(e.subreddit||'source')+' · '+esc(e.evidence_type||'source not yet categorized')+' · '+esc(e.sentiment||'neutral')+'</small></li>').join('')+'</ul></div>'}
async function load(){try{const r=await fetch('./retail_stocks.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Stock snapshot unavailable');snapshot=await r.json();try{const h=await fetch('./stock_sentiment_history.json?t='+Date.now(),{cache:'no-store'});history=h.ok?await h.json():null}catch(e){history=null}const sel=document.getElementById('stock'),prior=sel.value||new URLSearchParams(location.search).get('stock');sel.innerHTML=(snapshot.stocks||[]).slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>'<option value="'+esc(s.name)+'">'+esc(s.name)+'</option>').join('');if(prior&&[...sel.options].some(o=>o.value===prior))sel.value=prior;document.getElementById('status').textContent='Stock discussions collected: '+new Date(snapshot.collected_at).toLocaleString()+' · '+(snapshot.posts_collected||0)+' unique titles across the watchlist.';render()}catch(e){document.getElementById('status').textContent='Unable to load saved stock discussions: '+e.message}}
document.getElementById('stock').onchange=render;document.getElementById('refresh').onclick=load;load();
</script></body></html>
