name: Update public sentiment
on:
  push:
    branches: [main]
    paths:
      - 'index_crowd.py'
      - 'social_comments.py'
      - 'retail_stocks.py'
      - 'collect.py'
      - '.github/workflows/update.yml'
  schedule:
    # GitHub Actions minimum scheduled interval: every 5 minutes (UTC).
    # Starts may be delayed by GitHub; published data is not a live feed.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
concurrency:
  group: pdmp-snapshot-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public news
        id: news
        continue-on-error: true
        timeout-minutes: 3
        run: python collect.py
      - name: Collect Bitcoin volatility and price
        id: bitcoin
        continue-on-error: true
        timeout-minutes: 3
        run: python btc_volatility.py
      - name: Collect index investor crowd opinions
        continue-on-error: true
        timeout-minutes: 3
        run: python index_crowd.py
      - name: Collect public Indian stock discussion signals
        id: retail
        continue-on-error: true
        timeout-minutes: 8
        run: python retail_stocks.py
      - name: Collect no-account public social comments
        continue-on-error: true
        timeout-minutes: 2
        run: python social_comments.py
      - name: Verify NSE F&O underlying symbols
        continue-on-error: true
        timeout-minutes: 2
        run: python nse_fno_verify.py
      - name: Collect NSE client CE versus PE long positions
        id: options
        continue-on-error: true
        timeout-minutes: 3
        run: python client_options.py
      - name: Fetch index and India VIX quotes
        id: market
        continue-on-error: true
        timeout-minutes: 3
        run: python market_quotes.py
      - name: Save dated VIX readings and prior close
        id: vix
        continue-on-error: true
        timeout-minutes: 3
        run: python vix_history.py
      - name: Record daily sentiment history
        continue-on-error: true
        run: python sentiment_history.py
      - name: Record daily stock sentiment history
        continue-on-error: true
        run: python stock_sentiment_history.py
      - name: Record collector health
        if: always()
        env:
          NEWS: ${{ steps.news.outcome }}
          BITCOIN: ${{ steps.bitcoin.outcome }}
          RETAIL: ${{ steps.retail.outcome }}
          OPTIONS: ${{ steps.options.outcome }}
          MARKET: ${{ steps.market.outcome }}
          VIX: ${{ steps.vix.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          files={"news":"data.json","bitcoin":"btc_volatility.json","retail":"retail_stocks.json","options":"client_options.json","market":"market.json","vix":"vix_history.json"}
          checks={}
          for key,path in files.items():
              file=Path(path)
              status=os.getenv(key.upper(),"unknown")
              try:
                  payload=json.loads(file.read_text()) if file.exists() else None
                  valid=payload is not None
                  stamp=payload.get("collected_at") if isinstance(payload,dict) else None
              except (ValueError,OSError):
                  valid=False
                  stamp=None
              checks[key]={"step":status,"file_valid":valid,"data_timestamp":stamp}
          Path("collector_health.json").write_text(json.dumps({"checked_at":datetime.now(timezone.utc).isoformat(),"collectors":checks},indent=2)+chr(10))
          print(json.dumps(checks,indent=2))
          PY
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector_health.json
          if [ -f social_comments.json ]; then git add social_comments.json; fi
          if [ -f index_crowd.json ]; then git add index_crowd.json; fi
          if [ -f nse_fno_underlyings.json ]; then git add nse_fno_underlyings.json; fi
          if [ -f sentiment_history.json ]; then git add sentiment_history.json; fi
          if [ -f stock_sentiment_history.json ]; then git add stock_sentiment_history.json; fi
          for f in data.json market.json vix_history.json retail_stocks.json btc_volatility.json client_options.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "Update public sentiment snapshot"
          # Another editor or Pages-triggering commit may have landed during collection.
          # Rebase our data-only commit onto the latest main, then retry a bounded number of times.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Snapshot rebase conflict; will retry on next scheduled run."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Snapshot saved successfully"
              exit 0
            fi
            echo "Concurrent update detected; retrying ($attempt/5)"
            sleep 3
          done
          echo "Unable to push after 5 attempts"
          exit 1
