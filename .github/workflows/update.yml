name: Update public sentiment
on:
  schedule:
    # 09:15, 09:30, 10:00, 14:00, 15:45 IST (Mon-Fri); UTC below
    - cron: '45 3 * * 1-5'
    - cron: '0,30 4 * * 1-5'
    - cron: '30 8 * * 1-5'
    - cron: '15 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public news
        run: python collect.py
      - name: Fetch index and India VIX quotes
        run: python market_quotes.py
      - name: Save dated VIX readings and prior close
        run: python vix_history.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json market.json vix_history.json
          git diff --cached --quiet || (git commit -m "Update public sentiment snapshot" && git push)
