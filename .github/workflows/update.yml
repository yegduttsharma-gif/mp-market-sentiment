name: Update public sentiment
on:
  push:
    branches: [main]
    paths:
      - 'index_crowd.py'
      - 'social_comments.py'
      - 'youtube_comments.py'
      - 'youtube_retail.py'
      - 'reddit_comments.py'
      - 'reddit_retail.py'
      - 'tradingview_discovery.py'
      - 'frontpage_discovery.py'
      - 'retail_stocks.py'
      - 'collect.py'
      - '.github/workflows/update.yml'
  schedule:
    # Request a snapshot every 10 minutes (GitHub scheduling can be delayed).
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
concurrency:
  group: pdmp-snapshot-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public news
        id: news
        continue-on-error: true
        timeout-minutes: 3
        run: python collect.py
      - name: Collect Bitcoin volatility and price
        id: bitcoin
        continue-on-error: true
        timeout-minutes: 3
        run: python btc_volatility.py
      - name: Collect index investor crowd opinions
        continue-on-error: true
        timeout-minutes: 3
        run: python index_crowd.py
      - name: Collect public Indian stock discussion signals
        id: retail
        continue-on-error: true
        timeout-minutes: 8
        run: python retail_stocks.py
      - name: Collect actual YouTube viewer comments
        id: youtube
        continue-on-error: true
        timeout-minutes: 5
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube_comments.py
      - name: Classify YouTube retail positions and expectations
        continue-on-error: true
        run: python youtube_retail.py
      - name: Collect actual public Reddit replies
        continue-on-error: true
        timeout-minutes: 4
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
        run: python reddit_comments.py
      - name: Classify Reddit investor replies
        continue-on-error: true
        run: python reddit_retail.py
      - name: Collect no-account public social comments
        continue-on-error: true
        timeout-minutes: 2
        run: python social_comments.py
      - name: Collect public TradingQnA directional author views
        continue-on-error: true
        timeout-minutes: 4
        run: python tradingqna_sentiment.py
      - name: Collect public ValuePickr directional author views
        continue-on-error: true
        timeout-minutes: 4
        run: python valuepickr_sentiment.py
      - name: Check official Hacker News public Indian-market discussions
        continue-on-error: true
        timeout-minutes: 4
        run: python hackernews_discovery.py
      - name: Check Moneycontrol public investor message-board accessibility
        continue-on-error: true
        timeout-minutes: 2
        run: python moneycontrol_discovery.py
      - name: Check Investing.com index forum accessibility
        continue-on-error: true
        timeout-minutes: 2
        run: python investing_forum_discovery.py
      - name: Check public TradingView index idea pages
        continue-on-error: true
        timeout-minutes: 2
        run: python tradingview_discovery.py
      - name: Check FrontPage public Indian trader discussions
        continue-on-error: true
        timeout-minutes: 2
        run: python frontpage_discovery.py
      - name: Verify NSE F&O underlying symbols
        continue-on-error: true
        timeout-minutes: 2
        run: python nse_fno_verify.py
      - name: Collect NSE client CE versus PE long positions
        id: options
        continue-on-error: true
        timeout-minutes: 3
        run: python client_options.py
      - name: Fetch index and India VIX quotes
        id: market
        continue-on-error: true
        timeout-minutes: 3
        run: python market_quotes.py
      - name: Save dated VIX readings and prior close
        id: vix
        continue-on-error: true
        timeout-minutes: 3
        run: python vix_history.py
      - name: Record daily sentiment history
        continue-on-error: true
        run: python sentiment_history.py
      - name: Record daily stock sentiment history
        continue-on-error: true
        run: python stock_sentiment_history.py
      - name: Record collector health
        if: always()
        env:
          YOUTUBE: ${{ steps.youtube.outcome }}
          NEWS: ${{ steps.news.outcome }}
          BITCOIN: ${{ steps.bitcoin.outcome }}
          RETAIL: ${{ steps.retail.outcome }}
          OPTIONS: ${{ steps.options.outcome }}
          MARKET: ${{ steps.market.outcome }}
          VIX: ${{ steps.vix.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          files={"youtube":"youtube_comments.json","news":"data.json","bitcoin":"btc_volatility.json","retail":"retail_stocks.json","options":"client_options.json","market":"market.json","vix":"vix_history.json"}
          checks={}
          for key,path in files.items():
              file=Path(path)
              status=os.getenv(key.upper(),"unknown")
              try:
                  payload=json.loads(file.read_text()) if file.exists() else None
                  valid=payload is not None
                  stamp=payload.get("collected_at") if isinstance(payload,dict) else None
              except (ValueError,OSError):
                  valid=False
                  stamp=None
              checks[key]={"step":status,"file_valid":valid,"data_timestamp":stamp}
          Path("collector_health.json").write_text(json.dumps({"checked_at":datetime.now(timezone.utc).isoformat(),"collectors":checks},indent=2)+chr(10))
          print(json.dumps(checks,indent=2))
          PY
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Snapshot metadata is committed with the data; deployment may finish later.
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          health=json.loads(Path("collector_health.json").read_text()) if Path("collector_health.json").exists() else {}
          Path("snapshot_meta.json").write_text(json.dumps({"collected_at":health.get("checked_at"),"published_at":datetime.now(timezone.utc).isoformat(),"timestamp_meaning":"snapshot commit prepared; GitHub Pages deployment may follow"},indent=2)+"\\n")
          PY
          git add collector_health.json snapshot_meta.json
          if [ -f youtube_comments.json ]; then git add youtube_comments.json; fi
          if [ -f youtube_retail.json ]; then git add youtube_retail.json; fi
          if [ -f reddit_comments.json ]; then git add reddit_comments.json; fi
          if [ -f reddit_retail.json ]; then git add reddit_retail.json; fi
          if [ -f frontpage_discovery.json ]; then git add frontpage_discovery.json; fi
          if [ -f tradingview_discovery.json ]; then git add tradingview_discovery.json; fi
          if [ -f investing_forum_discovery.json ]; then git add investing_forum_discovery.json; fi
          if [ -f moneycontrol_discovery.json ]; then git add moneycontrol_discovery.json; fi
          if [ -f hackernews_discovery.json ]; then git add hackernews_discovery.json; fi
          if [ -f valuepickr_sentiment.json ]; then git add valuepickr_sentiment.json; fi
          if [ -f tradingqna_sentiment.json ]; then git add tradingqna_sentiment.json; fi
          if [ -f social_comments.json ]; then git add social_comments.json; fi
          if [ -f index_crowd.json ]; then git add index_crowd.json; fi
          if [ -f nse_fno_underlyings.json ]; then git add nse_fno_underlyings.json; fi
          if [ -f sentiment_history.json ]; then git add sentiment_history.json; fi
          if [ -f stock_sentiment_history.json ]; then git add stock_sentiment_history.json; fi
          for f in data.json market.json vix_history.json retail_stocks.json btc_volatility.json client_options.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          # Generated JSON is a replaceable snapshot, not a source-code change.
          # Re-stage it against the latest remote main instead of rebasing
          # generated JSON files, which produces unavoidable content conflicts.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --soft origin/main
            # Only publish generated JSON; never include workflow or source changes.
            git diff --cached --name-only -z | while IFS= read -r -d '' file; do
              case "$file" in
                *.json) ;;
                *) git reset -q HEAD -- "$file" ;;
              esac
            done
            if git diff --cached --quiet; then
              echo "Snapshot already current"
              exit 0
            fi
            git commit -m "Update public sentiment snapshot"
            if git push origin HEAD:main; then
              echo "Snapshot saved successfully"
              exit 0
            fi
            echo "Concurrent update detected; retrying ($attempt/5)"
            sleep 3
          done
          echo "Unable to push after 5 attempts"
          exit 1
